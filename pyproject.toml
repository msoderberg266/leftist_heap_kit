[project]
name = "leftist-heap-kit"
version = "0.1.0"
description = "A pure-Python min-priority queue implementation using leftist heaps with O(log n) merge"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
